<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style> 
        body {
            background-color: rgb(255, 247, 133);
            background-image: linear-gradient(20deg, rgb(253, 237, 8), rgb(255, 0, 0));
            height: 100vh;
        }

        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: linear-gradient(45deg, rgb(242, 255, 0), rgb(0, 76, 255));
        }
        .kotak2 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: radial-gradient( rgb(242, 255, 0), rgb(0, 76, 255));
        }
        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: conic-gradient( rgb(242, 255, 0), rgb(0, 76, 255));
        }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
