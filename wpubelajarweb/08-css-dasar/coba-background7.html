<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>
    <style>
        body {
            min-width: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #333;
        }

        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin: auto;
            background-image: url(img/bg-removebg-preview.png),url(img/TheAdams-removebg-preview.png),url(img/blop-removebg-preview.png);
            background-size:cover,320px,400px;
            background-repeat: no-repeat;
            background-position:center top, center, center bottom;;
            background-color: #f0f0f0;
            border-radius: 50%;
            
        }

        h1 {
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            color: aliceblue;
            font-size: 40px;
            text-shadow: 2px 2px 4px black;
        }

    </style>
</head>
<body>
    <h1>Profle Card</h1>
    <div class="frame"></div>
</body>
</html>
