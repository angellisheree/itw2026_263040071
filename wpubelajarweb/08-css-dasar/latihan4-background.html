<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Galau</title>
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Slabo+27px&display=swap');



    body {
    font-weight: bold;
    color: rgb(205, 98, 180);
    text-align: center;
    background-color: #0F172A;
    background-image: linear-gradient(to bottom, rgb(15 23 42 / 90%) 60%, rgb(15 23 42 / 40%)), url('img/pakfarid.jpeg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
}

    h1 {
      font-size: 4em;
        font-family: "Pacifico", sans-serif;
      font-style: italic;
      text-transform: capitalize;
      letter-spacing: 10px;
      /* text-shadow: 5px 5px 0 rgb(56 159 255/50%); */
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgb(143, 149, 39));
      background-image: linear-gradient(to right, blue, rgb(255, 166, 166))
      
      
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
      background-color: rgb(255 255 255/5%);
      max-width: 700px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid; rgb(255 255 255)
      box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
    }

    span {
      color: rgb(223, 21, 21);
      text-decoration: none;
      text-shadow: rgba(255, 0, 0, 0.8);
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151 151 151/60%);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid rgb(255 255 255 / 20%);
      width: 30%;
      padding-top: 20px;
      margin: 30px auto
      
    }
  </style>
</head>

<body>

  <h1>Satu Terbela Selalu</h1>

  <p class="quote">
    "Tidak semua perjuangan harus disaksikan banyak mata. <br>
    Tidak semua kebaikan membutuhkan pengakuan <span>manusia.</span> <br>
    Sebab, ada hal yang tetap pantas diperjuangkan,<br> 
    bahkan ketika tidak ada seorang pun yang memahami alasannya."
  </p>

  <p class="credit">— Satu Terbela Selalu · FSTVLST</p>

</body>

</html>
