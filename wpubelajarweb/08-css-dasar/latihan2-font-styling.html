<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Galau</title>
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Slabo+27px&display=swap');



    body {
      
      font-weight: bold;
      color: rgb(96, 40, 3);
      text-align: center;
    }

    h1 {
      font-size: 48px;
        font-family: "Pacifico", sans-serif;
      font-style: italic;
      text-transform: capitalize;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgba(255, 255, 0, 0.811);  
      text-shadow: 5px 5px 0 rgb(141, 194, 244);
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color: rgb(181, 181, 181);
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151, 151, 151);
      font-weight: normal;
    }
  </style>
</head>

<body>

  <h1>Satu Terbela Selalu</h1>

  <p class="quote">
    "Tidak semua perjuangan harus disaksikan banyak mata. <br>
    Tidak semua kebaikan membutuhkan pengakuan <span>manusia.</span> <br>
    Sebab, ada hal yang tetap pantas diperjuangkan,<br> 
    bahkan ketika tidak ada seorang pun yang memahami alasannya."
  </p>

  <p class="credit">— Satu Terbela Selalu · FSTVLST</p>

</body>

</html>
